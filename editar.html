<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Livro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <form action="{{ url_for('editar', id=livro[0]) }}" method="post">
      <h2>Editar Livro</h2>

      <label for="titulo">Título:</label>
      <input type="text" id="titulo" name="nome" value="{{ livro[1] }}" required>

      <label for="autor">Autor:</label>
      <input type="text" id="autor" name="autor" value="{{ livro[2] }}" required>

      <label for="ano">Ano de Publicação:</label>
      <input type="number" id="ano" name="ano" value="{{ livro[3] }}" required>

      <div class="style">
        <button type="submit">Salvar Alterações</button>
      </div>

      <br>
      <a href="{{ url_for('index') }}" style="display: block; text-align: center; text-decoration: none; color: #666;">Cancelar</a>
  </form>

</body>
</html>
